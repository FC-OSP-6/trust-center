## MIL-345 runtime contract freeze:
## - keep these exact service names: frontend, api, postgres, redis
## - keep host ports 5173 and 4000 stable for local/demo parity
## - frontend proxies to the api service name inside Compose
## - redis is present now for network/health wiring, but the app stays on CACHE_ADAPTER=lru
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - '5173:5173'
    environment:
      # Vite derives the proxy target from HOST + SERVER_PORT.
      HOST: http://api
      SERVER_PORT: '4000'
      VITE_DEV_HOST: 0.0.0.0

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - '4000:4000'
    environment:
      SERVER_PORT: '4000'
      DATABASE_URL: postgres://trust_center:trust_center@postgres:5432/trust_center
      ADMIN_SECRET: replace-me
      # The Redis adapter is still a stub in this repo, so keep LRU active.
      CACHE_ADAPTER: lru
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(res => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trust_center
      POSTGRES_USER: trust_center
      POSTGRES_PASSWORD: trust_center
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  postgres-data:
